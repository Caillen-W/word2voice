name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
  ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk
  ACCEPT_EULA: Y
  ANDROID_ACCEPT_LICENSES: 1
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip openjdk-17-jdk build-essential ccache git \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev aidl

      - name: Pre-install Android SDK (in buildozer's default folder) and accept all licenses
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest"
          # 再接受一次，避免新装的组件又触发许可证确认
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true
          # buildozer 老版本硬编码找旧路径 tools/bin/sdkmanager，
          # 新版 SDK 已把它放到 cmdline-tools/latest/bin/，这里建立软链接兜底
          mkdir -p "$ANDROID_HOME/tools/bin"
          for tool in "$ANDROID_HOME/cmdline-tools/latest/bin/"*; do
            ln -sf "$tool" "$ANDROID_HOME/tools/bin/$(basename "$tool")"
          done
          # 把 licenses 目录拷到 buildozer 可能读取的几个位置兜底
          for d in \
            "$HOME/.android" \
            "$ANDROID_HOME/../android-sdk/licenses" \
            "$HOME/.buildozer/android/platform/android-sdk/licenses"; do
            mkdir -p "$d"
            cp -rf "$ANDROID_HOME/licenses/"* "$d/" 2>/dev/null || true
          done

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word2voice-apk
          path: bin/*.apk
