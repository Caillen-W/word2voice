name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
  ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (incl. native aidl)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            zip unzip openjdk-17-jdk build-essential ccache git \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev libbz2-dev libreadline-dev libsqlite3-dev \
            libjpeg-dev libpng-dev \
            aidl

      - name: Install / upgrade buildozer and friends
        run: |
          pip install --upgrade pip
          pip install -U \
            buildozer==1.5.0 \
            cython==0.29.36 \
            virtualenv \
            sh

      - name: Pre-install Android SDK into buildozer's folder, accept licenses, symlink old paths
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # 接受所有 SDK 许可证
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          # 安装需要的包（注意：不装 NDK，让 buildozer 自己装它需要的版本）
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"
          # 再接受一次（新装的包可能触发新许可证）
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true
          # 把 cmdline-tools/latest/bin/* 软链到老路径 tools/bin/
          # 这样 buildozer 老版本硬编码的 tools/bin/sdkmanager 路径能命中
          mkdir -p "$ANDROID_HOME/tools/bin"
          for t in "$ANDROID_HOME/cmdline-tools/latest/bin"/*; do
            ln -sf "$t" "$ANDROID_HOME/tools/bin/$(basename "$t")"
          done
          # licenses 兜底复制到 buildozer 可能读取的几个位置
          for d in "$HOME/.android" "$ANDROID_HOME/licenses"; do
            mkdir -p "$d"
            cp -rf "$ANDROID_HOME/licenses/"* "$d/" 2>/dev/null || true
          done
          # 让后续 step 也能用 sdkmanager
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Build APK (debug)
        run: buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word2voice-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            .buildozer/
            **/*.log
