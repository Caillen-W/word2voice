name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  PACKAGE_NAME: word2voice
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK + NDK + build-tools + accept all licenses
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            build-tools;34.0.0
            platforms;android-34
            cmdline-tools;latest
            ndk;25b

      - name: Install system dependencies (incl. native aidl)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            zip unzip openjdk-17-jdk build-essential ccache git \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev libbz2-dev libreadline-dev libsqlite3-dev \
            libjpeg-dev libpng-dev \
            aidl

      - name: Install / upgrade buildozer and friends
        run: |
          pip install --upgrade pip
          pip install -U \
            buildozer==1.5.0 \
            cython==0.29.36 \
            virtualenv \
            sh

      - name: Patch buildozer's SDK layout (new cmdline-tools)
        run: |
          set -eux
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          # buildozer 老路径 tools/bin/sdkmanager 指向新版位置
          mkdir -p "$SDK/tools/bin"
          SRC="$SDK/cmdline-tools/latest/bin"
          [ -d "$SRC" ] || SRC="$SDK/cmdline-tools/9.0/bin"
          for t in "$SRC"/*; do
            ln -sf "$t" "$SDK/tools/bin/$(basename "$t")"
          done
          # licenses 兜底
          for d in "$HOME/.android" "$SDK/licenses"; do
            mkdir -p "$d"
            cp -rf "$SDK/licenses/"* "$d/" 2>/dev/null || true
          done
          # 给 buildozer 用的 NDK 环境变量
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Build APK (debug)
        run: buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word2voice-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            .buildozer/
            **/*.log
